<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Квартиры — карта</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#F6F5F1; --card:#FFFFFF; --ink:#1B1A17; --muted:#6B675F; --rule:#E3E0D8;
    --work:#1B1A17;
    --fb:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--fb);-webkit-font-smoothing:antialiased}
  .shell{display:flex;flex-direction:column;height:100%}
  header{flex:0 0 auto;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--card);
         display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12.5px;color:var(--muted)}
  .legend .ln{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:4px;vertical-align:2px}
  .legend label{cursor:pointer;user-select:none}
  .main{flex:1 1 auto;display:flex;min-height:0}
  #map{flex:1 1 auto;min-width:0}
  aside{flex:0 0 300px;overflow:auto;border-left:1px solid var(--rule);background:var(--card)}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 14px 6px;font-weight:600}
  .item{display:flex;gap:10px;padding:8px 14px;cursor:pointer;border-top:1px solid var(--rule);align-items:center}
  .item:hover{background:#F3F1EC}
  .item .n{flex:0 0 26px;height:26px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
  .item .t{flex:1 1 auto;min-width:0}
  .item .a{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  @media (max-width:760px){
    .main{flex-direction:column}
    aside{flex:0 0 34%;border-left:0;border-top:1px solid var(--rule)}
  }

  /* markers */
  .pin{width:28px;height:28px;border-radius:50%;border:2px solid #fff;color:#fff;font:700 12px/24px var(--fb);
       text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .wk{position:relative;display:block;width:14px;height:14px;background:var(--work);border:2px solid #fff;border-radius:3px;
      box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .wk span{position:absolute;right:18px;top:-4px;background:var(--work);color:#fff;font:600 11.5px/1 var(--fb);padding:4px 6px;
      border-radius:3px;white-space:nowrap}
  .mapwrap{position:relative;flex:1 1 auto;min-width:0;display:flex}
  .leaflet-div-icon{background:none;border:0}

  /* apartment card */
  #card{position:absolute;z-index:800;width:min(460px, calc(100% - 24px));background:#fff;border-radius:10px;overflow:hidden;
      box-shadow:0 10px 32px rgba(0,0,0,.28);display:none}
  #card.on{display:block}
  .c-ph{position:relative;height:300px;background:#1B1A17;user-select:none}
  .c-ph img{width:100%;height:100%;object-fit:contain;display:block}
  .c-nav{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;cursor:pointer;color:#fff;
      font:400 34px/1 var(--fb);display:flex;align-items:center;padding:0 12px;opacity:.75}
  .c-nav:hover{opacity:1;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,0))}
  .c-nav.nx{right:0;justify-content:flex-end}
  .c-nav.nx:hover{background:linear-gradient(270deg,rgba(0,0,0,.35),rgba(0,0,0,0))}
  .c-nav:focus-visible{outline:2px solid #fff;outline-offset:-4px}
  .c-cnt{position:absolute;right:10px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 7px;border-radius:10px;
      font-variant-numeric:tabular-nums}
  .c-x{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;
      font:400 18px/28px var(--fb);cursor:pointer;display:none}
  #card.pinned .c-x{display:block}
  .c-b{padding:12px 14px 14px}
  .c-t{font-weight:650;font-size:15.5px;margin:0}
  .c-area{color:var(--muted);font-size:12.5px;margin:2px 0 8px}
  .c-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:13px;font-variant-numeric:tabular-nums}
  .c-grid div{display:flex;justify-content:space-between;gap:8px}
  .c-grid span{color:var(--muted)}
  .c-grid b{font-weight:600}
  .c-tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--rule);margin-top:8px;padding-top:8px}
  .c-tot b{font-size:17px}
  .c-link{display:inline-block;margin-top:8px;font-size:13px;color:#0B61C8;text-decoration:none;font-weight:600}
  @media (max-width:760px){ .c-ph{height:220px} }
  .badge{display:inline-block;padding:1px 6px;border-radius:3px;color:#fff;font-size:12px}
  .c-link{display:inline-block;margin-top:8px;font-size:12.5px;color:#0B61C8;text-decoration:none;font-weight:600}
  .stn{font-size:12px}
  .stn b{font-weight:650}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Квартиры на карте</h1>
    <div class="legend" id="legend"></div>
  </header>
  <div class="main">
    <div class="mapwrap"><div id="map"></div><div id="card" role="dialog" aria-label="Квартира"></div></div>
    <aside><h2>По totalpris</h2><div id="list"></div></aside>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

Promise.all([fetch("data/apartments.json",{cache:"no-cache"}).then(function(r){return r.json();}),
             fetch("data/metro.json").then(function(r){return r.json();})])
.then(function(res){
  var APTS = res[0].apartments, WORK = res[0].places, METRO = res[1].lines, STATIONS = res[1].stations;
  var PIN = "#C2410C";

  function fmt(n){ return Math.round(n).toLocaleString("nb-NO").replace(/ /g," "); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function decode(str){
    var i=0, lat=0, lng=0, out=[];
    while(i<str.length){
      var b, sh=0, r=0;
      do{ b=str.charCodeAt(i++)-63; r|=(b&31)<<sh; sh+=5; }while(b>=32);
      lat += (r&1) ? ~(r>>1) : (r>>1);
      sh=0; r=0;
      do{ b=str.charCodeAt(i++)-63; r|=(b&31)<<sh; sh+=5; }while(b>=32);
      lng += (r&1) ? ~(r>>1) : (r>>1);
      out.push([lat/1e5, lng/1e5]);
    }
    return out;
  }

  APTS.forEach(function(a){ a.total = a.pris + a.fg + a.omk; });

  var map = L.map("map", {zoomControl:true, preferCanvas:false}).setView([59.905, 10.82], 12);
  var esriAttr = 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
  L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {maxZoom:19, maxNativeZoom:16, attribution:esriAttr}).addTo(map);
  L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {maxZoom:19, maxNativeZoom:16}).addTo(map);

  /* ---- metro ---- */
  map.createPane("metro"); map.getPane("metro").style.zIndex = 420;
  var metroLayer = L.layerGroup().addTo(map);
  var lineColors = {};
  METRO.forEach(function(l){
    lineColors[l.r] = l.c;
    l.p.forEach(function(enc){
      var pts = decode(enc);
      L.polyline(pts, {pane:"metro", color:"#fff", weight:8, opacity:.9, interactive:false}).addTo(metroLayer);
      L.polyline(pts, {pane:"metro", color:l.c, weight:4.5, opacity:.95, interactive:false}).addTo(metroLayer);
    });
  });
  var stationLayer = L.layerGroup().addTo(map);
  STATIONS.forEach(function(f){
    var lines = f[3].split("");
    var chips = lines.map(function(n){ return '<span class="badge" style="background:'+(lineColors[n]||"#555")+'">'+n+'</span>'; }).join(" ");
    L.circleMarker([+f[1], +f[2]], {pane:"metro", radius:4, color:"#1B1A17", weight:1.5, fillColor:"#fff", fillOpacity:1})
      .bindTooltip('<div class="stn"><b>'+esc(f[0])+'</b> '+chips+'</div>', {direction:"top", offset:[0,-4]})
      .addTo(stationLayer);
  });

  /* ---- work ---- */
  WORK.forEach(function(w){
    L.marker([w.lat, w.lng], {icon: L.divIcon({className:"", html:'<span class="wk"><span>'+esc(w.short)+'</span></span>', iconSize:[14,14], iconAnchor:[7,7]}), zIndexOffset:500})
      .bindTooltip(esc(w.name)+'<br>'+esc(w.addr), {direction:"left", offset:[-8,0]}).addTo(map);
  });

  /* ---- apartments ---- */
  var canHover = window.matchMedia && window.matchMedia("(hover: hover)").matches;
  var cardEl = document.getElementById("card"), wrap = cardEl.parentElement;
  var cur = null, idx = 0, pinned = false, hideT = null, markers = {};

  function cardHtml(a){
    var n = a.imgs.length;
    return '<div class="c-ph">'
      + '<img id="c-img" alt="" referrerpolicy="no-referrer">'
      + (n > 1 ? '<button class="c-nav pv" id="c-pv" aria-label="Предыдущее фото">‹</button><button class="c-nav nx" id="c-nx" aria-label="Следующее фото">›</button>' : '')
      + '<span class="c-cnt" id="c-cnt"></span>'
      + '<button class="c-x" id="c-x" aria-label="Закрыть">×</button>'
      + '</div>'
      + '<div class="c-b"><p class="c-t">'+a.row+'. '+esc(a.addr)+'</p>'
      + '<p class="c-area">'+(a.area ? esc(a.area)+' · ' : '')+a.m2+' м² · парковка: '+esc(a.parking)+'</p>'
      + '<div class="c-grid">'
      + '<div><span>Prisantydning</span><b>'+fmt(a.pris)+'</b></div>'
      + '<div><span>Felleskost/мес</span><b>'+fmt(a.felles)+'</b></div>'
      + '<div><span>Fellesgjeld</span><b>'+fmt(a.fg)+'</b></div>'
      + '<div><span>Omkostninger</span><b>'+fmt(a.omk)+'</b></div>'
      + '</div>'
      + '<div class="c-tot"><span>Totalpris</span><b>'+fmt(a.total)+'</b></div>'
      + '<a class="c-link" href="'+esc(a.url)+'" target="_blank" rel="noopener">Открыть объявление →</a>'
      + '</div>';
  }
  function showImg(){
    var n = cur.imgs.length; idx = (idx % n + n) % n;
    document.getElementById("c-img").src = cur.imgs[idx];
    document.getElementById("c-cnt").textContent = (idx+1) + " / " + n;
    [1, -1, 2].forEach(function(d){ var im = new Image(); im.referrerPolicy = "no-referrer"; im.src = cur.imgs[((idx+d)%n+n)%n]; });
  }
  function step(d){ if(!cur) return; idx += d; showImg(); }
  function place(){
    if(!cur) return;
    var pt = map.latLngToContainerPoint([cur.lat, cur.lng]);
    var W = wrap.clientWidth, H = wrap.clientHeight, w = cardEl.offsetWidth, h = cardEl.offsetHeight;
    var g = 20, m = 8, left, top;
    var cx = Math.max(m, Math.min(W - w - m, pt.x - w/2)), cy = Math.max(m, Math.min(H - h - m, pt.y - h/2));
    if(pt.y - g - h >= m){ left = cx; top = pt.y - g - h; }            // above the pin
    else if(pt.y + g + h <= H - m){ left = cx; top = pt.y + g; }        // below
    else if(pt.x + g + w <= W - m){ left = pt.x + g; top = cy; }        // to the right
    else if(pt.x - g - w >= m){ left = pt.x - g - w; top = cy; }        // to the left
    else { left = cx; top = m; }
    cardEl.style.left = left + "px"; cardEl.style.top = top + "px";
  }
  function openCard(a, pin){
    clearTimeout(hideT);
    if(cur !== a){
      cur = a; idx = 0;
      cardEl.innerHTML = cardHtml(a);
      var pv = document.getElementById("c-pv"), nx = document.getElementById("c-nx");
      if(pv) pv.onclick = function(e){ e.stopPropagation(); step(-1); };
      if(nx) nx.onclick = function(e){ e.stopPropagation(); step(1); };
      document.getElementById("c-x").onclick = function(e){ e.stopPropagation(); closeCard(); };
      showImg();
    }
    if(pin) pinned = true;
    cardEl.classList.add("on"); cardEl.classList.toggle("pinned", pinned);
    place();
  }
  function closeCard(){ clearTimeout(hideT); cur = null; pinned = false; cardEl.classList.remove("on", "pinned"); }
  function scheduleHide(){ if(pinned) return; clearTimeout(hideT); hideT = setTimeout(closeCard, 350); }

  cardEl.addEventListener("mouseenter", function(){ clearTimeout(hideT); });
  cardEl.addEventListener("mouseleave", scheduleHide);
  L.DomEvent.disableClickPropagation(cardEl); L.DomEvent.disableScrollPropagation(cardEl);
  map.on("move zoom", place);
  map.on("click", closeCard);
  document.addEventListener("keydown", function(e){
    if(!cur) return;
    if(e.key === "ArrowRight"){ step(1); e.preventDefault(); }
    else if(e.key === "ArrowLeft"){ step(-1); e.preventDefault(); }
    else if(e.key === "Escape"){ closeCard(); }
  });

  APTS.forEach(function(a){
    var icon = L.divIcon({className:"", html:'<div class="pin" style="background:'+PIN+'">'+a.row+'</div>', iconSize:[28,28], iconAnchor:[14,14]});
    var m = L.marker([a.lat, a.lng], {icon:icon, zIndexOffset:1000, riseOnHover:true, keyboard:true, title:a.addr}).addTo(map);
    if(canHover){
      m.on("mouseover", function(){ if(pinned && cur !== a) return; openCard(a, false); });
      m.on("mouseout", scheduleHide);
    }
    m.on("click", function(){ if(pinned && cur !== a){ pinned = false; } openCard(a, true); });
    markers[a.row] = m;
  });

  /* ---- list ---- */
  var list = document.getElementById("list");
  APTS.slice().sort(function(x,y){ return x.total - y.total; }).forEach(function(a){
    var d = document.createElement("div"); d.className = "item";
    d.innerHTML = '<div class="n" style="background:'+PIN+'">'+a.row+'</div>'
      + '<div class="t"><div class="a">'+esc(a.addr)+'</div><div class="s">'+fmt(a.total)+' · '+a.m2+' м² · felleskost '+fmt(a.felles)+'</div></div>';
    d.onclick = function(){ closeCard(); map.flyTo([a.lat, a.lng], 14, {duration:.6}); map.once("moveend", function(){ openCard(a, true); }); };
    list.appendChild(d);
  });

  /* ---- legend ---- */
  var lg = document.getElementById("legend");
  lg.innerHTML =
    '<span>T-bane:</span>'
  + ["1","2","3","4","5"].map(function(n){ return '<span><span class="ln" style="background:'+(lineColors[n]||"#555")+'"></span>'+n+'</span>'; }).join("")
  + '<label><input type="checkbox" id="tgl" checked> метро</label>';
  document.getElementById("tgl").onchange = function(e){
    if(e.target.checked){ metroLayer.addTo(map); stationLayer.addTo(map); } else { map.removeLayer(metroLayer); map.removeLayer(stationLayer); }
  };

  var b = L.latLngBounds(APTS.map(function(a){ return [a.lat,a.lng]; }).concat(WORK.map(function(w){ return [w.lat,w.lng]; })));
  map.fitBounds(b.pad(0.08));

  /* the previous app on this address registered an offline service worker; remove it */
  if("serviceWorker" in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }).catch(function(){}); }
})
.catch(function(e){ document.getElementById("list").textContent = "Не удалось загрузить данные: " + e.message; });
</script>
</body>
</html>
