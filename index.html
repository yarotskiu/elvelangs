<style>
  :root{

    --flame:#FF9C2B; --ember:#DD5B24; --river:#7FB6C4;
    --fd:"Instrument Serif",Georgia,serif;
    --fb:"Archivo","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--text);
    font:15px/1.55 var(--fb);-webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }

  .shell{display:flex;flex-direction:column;height:100%}

  header{
    flex:0 0 auto;padding:16px 20px 14px;border-bottom:1px solid var(--rule);
    display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;
    background:linear-gradient(180deg,#151209,var(--ink));
  }
  .brand{flex:1 1 260px;min-width:0}
  h1{font:400 clamp(24px,4.6vw,34px)/1.05 var(--fd);margin:0 0 4px;letter-spacing:-.01em}
  h1 em{font-style:italic;color:var(--flame)}
  .sub{margin:0;color:var(--muted);font-size:13px}
  .sub b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:var(--ink-2)}
  .seg button{
    appearance:none;border:0;background:transparent;color:var(--muted);
    font:600 11px/1 var(--fb);letter-spacing:.13em;padding:9px 13px;cursor:pointer;
  }
  .seg button + button{border-left:1px solid var(--rule)}
  .seg button[aria-pressed="true"]{background:var(--flame);color:#1A1207}
  .seg button:hover:not([aria-pressed="true"]){color:var(--text)}
  .seg button:focus-visible{outline:2px solid var(--river);outline-offset:-2px}

  .geo{flex:1 1 100%;margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .geo b{color:var(--flame);font-weight:600}
  .dl{color:var(--dim)}
  .dl.ok{color:var(--river)}
  .me{
    width:16px;height:16px;border-radius:50%;background:#5BC8F5;border:2px solid #0E0D0B;
    box-shadow:0 0 0 2px rgba(91,200,245,.4),0 0 18px 5px rgba(91,200,245,.55);
  }

  .main{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) 370px;min-height:0}
  #map{height:100%;width:100%;background:#0B0A08}
  .side{border-left:1px solid var(--rule);overflow-y:auto;background:var(--ink);min-height:0}

  .side-head{padding:14px 18px 10px;position:sticky;top:0;background:var(--ink);border-bottom:1px solid var(--rule);z-index:2}
  .side-head h2{font:400 19px/1.2 var(--fd);margin:0}
  .side-head p{margin:2px 0 0;color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase}

  .stop{
    display:block;width:100%;text-align:left;appearance:none;background:transparent;
    border:0;border-bottom:1px solid var(--rule);padding:14px 18px 15px;cursor:pointer;
    color:inherit;font:inherit;transition:background .15s;
  }
  .stop:hover{background:var(--card)}
  .stop.is-active{background:var(--card-2);box-shadow:inset 3px 0 0 var(--flame)}
  .stop:focus-visible{outline:2px solid var(--river);outline-offset:-2px}
  .stop-top{display:flex;gap:10px;align-items:baseline}
  .num{
    flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--flame);color:#1A1207;
    font:700 11px/21px var(--fb);text-align:center;
  }
  .stop h3{flex:1 1 auto;font:400 19px/1.2 var(--fd);margin:0;min-width:0}
  .time{font:600 12px/1 var(--fb);color:var(--flame);font-variant-numeric:tabular-nums;white-space:nowrap}
  .act{margin:7px 0 0 31px;font-weight:600;font-size:14px}
  .desc{margin:3px 0 0 31px;color:var(--muted);font-size:13.5px}
  .meta{margin:9px 0 0 31px;font-size:12px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap}
  .meta b{color:var(--muted);font-weight:500}
  .dist{margin-left:auto;color:var(--flame);font-weight:600;font-variant-numeric:tabular-nums}

  .side-foot{padding:16px 18px 28px;color:var(--dim);font-size:11.5px;line-height:1.5}
  .side-foot a{color:var(--river)}
  .side-foot p{margin:0 0 8px}

  /* leaflet skin */
  .leaflet-container{font-family:var(--fb);background:#0B0A08}
  .leaflet-control-zoom a{background:var(--card);color:var(--text);border-color:var(--rule)}
  .leaflet-control-zoom a:hover{background:var(--card-2);color:var(--flame)}
  .leaflet-control-attribution{background:rgba(14,13,11,.82);color:var(--dim);font-size:10px}
  .leaflet-control-attribution a{color:var(--muted)}
  .pin{
    width:26px;height:26px;border-radius:50%;background:var(--flame);color:#1A1207;
    font:700 12px/26px var(--fb);text-align:center;
    box-shadow:0 0 0 3px rgba(255,156,43,.22),0 0 16px 4px rgba(255,156,43,.5);
    transition:transform .18s ease;
  }
  .pin.is-active{transform:scale(1.28);box-shadow:0 0 0 4px rgba(255,156,43,.3),0 0 26px 8px rgba(255,156,43,.7)}
  .cap{
    width:13px;height:13px;border-radius:50%;background:#0E0D0B;border:2px solid var(--river);
    box-shadow:0 0 10px 2px rgba(127,182,196,.5);
  }
  .leaflet-popup-content-wrapper{background:var(--card);color:var(--text);border-radius:3px;border:1px solid var(--rule)}
  .leaflet-popup-tip{background:var(--card);border:1px solid var(--rule)}
  .leaflet-popup-content{margin:12px 14px;font-size:13.5px;line-height:1.5}
  .leaflet-popup-content h4{font:400 18px/1.15 var(--fd);margin:0 0 2px}
  .leaflet-popup-content .pt{color:var(--flame);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
  .leaflet-popup-content .pa{margin:6px 0 0;font-weight:600}
  .leaflet-popup-content .pd{margin:3px 0 0;color:var(--muted)}
  .leaflet-popup-content .pl{display:inline-block;margin-top:9px;color:var(--river)}
  .leaflet-popup-close-button{color:var(--muted)!important}

  @media (max-width:820px){
    .main{grid-template-columns:1fr;grid-template-rows:52vh minmax(0,1fr)}
    .side{border-left:0;border-top:1px solid var(--rule)}
    header{padding:14px 16px 12px}
  }
</style>

  function onGeoErr(){ geoMsg = "geoDenied"; stopGeo(true); setGeoWanted(false); renderGeo(); }

  function startGeo(){
    if(!navigator.geolocation){ geoMsg = "geoNoSupport"; renderGeo(); return; }
    if(watchId !== null) return;
    geoMsg = null; firstFix = true; following = true;
    watchId = navigator.geolocation.watchPosition(onFix, onGeoErr, {enableHighAccuracy:true, maximumAge:10000, timeout:25000});
    setGeoWanted(true);
    renderGeo();
  }

  function stopGeo(keepMsg){
    if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
    if(meMarker){ map.removeLayer(meMarker); map.removeLayer(meCircle); meMarker = null; meCircle = null; }
    geoNearIdx = null; geoNearDist = null; lastLL = null; firstFix = true; following = false;
    if(!keepMsg) geoMsg = null;
  }

  function renderGeo(){
    var t = T[lang];
    if(geoMsg){ geoEl.textContent = t[geoMsg]; geoEl.hidden = false; }
    else if(geoNearIdx !== null){
      geoEl.innerHTML = esc(t.geoNear) + ": <b>" + esc(STOPS[geoNearIdx][lang].p) + "</b> \u00b7 " + esc(fmt(geoNearDist));
      geoEl.hidden = false;
    } else if(watchId !== null){ geoEl.textContent = t.bGeoWait; geoEl.hidden = false; }
    else { geoEl.textContent = ""; geoEl.hidden = true; }

    STOPS.forEach(function(s, i){
      var el = document.querySelector("#row-" + s.id + " [data-dist]");
      if(el) el.textContent = lastLL ? fmt(hav(lastLL, s.ll)) : "";
    });

    geoBtn.textContent = watchId === null ? t.bGeo : (following ? t.bGeoOff : t.bGeoCenter);
    geoBtn.setAttribute("aria-pressed", String(watchId !== null && following));
  }

  geoBtn.addEventListener("click", function(){
    if(watchId === null){ startGeo(); return; }
    if(!following){ following = true; if(lastLL) map.flyTo(lastLL, Math.max(map.getZoom(), 15), {duration:.6}); renderGeo(); return; }
    stopGeo(); setGeoWanted(false); renderGeo();
  });

  map.on("dragstart", function(){ if(following){ following = false; renderGeo(); } });

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible" && watchId === null && geoWanted() && !geoMsg) startGeo();
  });

  // auto-start on open when the viewer has used it before or already granted permission
  (function(){
    function maybe(granted){ if(geoWanted() || granted) startGeo(); }
    if(navigator.permissions && navigator.permissions.query){
      try{
        navigator.permissions.query({name:"geolocation"})
          .then(function(st){ maybe(st.state === "granted"); })
          .catch(function(){ maybe(false); });
        return;
      }catch(e){}
    }
    maybe(false);
  })();

  // ---- offline map ----
  var dlEl = document.getElementById("dl"), dlBtn = document.getElementById("b-dl"), dlBusy = false;
  var DL_ZOOMS = [12, 13, 14, 15, 16];

  function dlDone(){ try{ return localStorage.getItem("elv-offline") === "1"; }catch(e){ return false; } }

  function tileXY(lat, lon, z){
    var n = Math.pow(2, z), r = lat * Math.PI / 180;
    return [ Math.floor((lon + 180) / 360 * n),
             Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n) ];
  }

  function tileUrls(){
    var urls = [], seen = {};
    DL_ZOOMS.forEach(function(z){
      river.forEach(function(p){
        var t = tileXY(p[0], p[1], z);
        for(var dx = -1; dx <= 1; dx++){
          for(var dy = -1; dy <= 1; dy++){
            var x = t[0] + dx, y = t[1] + dy, k = z + "/" + x + "/" + y;
            if(seen[k]) continue;
            seen[k] = 1;
            urls.push("https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/" + z + "/" + y + "/" + x);
            urls.push("https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/" + z + "/" + y + "/" + x);
            urls.push("https://tile.openstreetmap.org/" + z + "/" + x + "/" + y + ".png");
          }
        }
      });
    });
    return urls;
  }

  function setDl(text, ok){
    if(!text){ dlEl.hidden = true; dlEl.textContent = ""; return; }
    dlEl.hidden = false; dlEl.textContent = text;
    dlEl.classList.toggle("ok", !!ok);
  }

  function renderDl(){
    var t = T[lang];
    if(dlBusy) return;
    dlBtn.textContent = dlDone() ? t.bDlDone : t.bDl;
    dlBtn.setAttribute("aria-pressed", String(dlDone()));
    if(dlDone()) setDl(t.dlReady, true); else setDl("");
  }

  function download(){
    var t = T[lang];
    if(!window.caches){ setDl(t.dlNoSupport); return; }
    var urls = tileUrls(), total = urls.length, done = 0, failed = 0, i = 0;
    dlBusy = true;
    dlBtn.disabled = true;
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});

    caches.open("elv-tiles-v1").then(function(cache){
      function tick(){
        var pct = Math.round(done / total * 100);
        dlBtn.textContent = pct + "%";
        setDl(T[lang].dlBusy + ": " + done + " / " + total);
      }
      function next(){
        if(i >= total) return Promise.resolve();
        var url = urls[i++];
        return cache.match(url, {ignoreVary:true}).then(function(hit){
          if(hit) return null;
          return fetch(url, {mode:"cors"}).then(function(r){
            if(r && r.status === 200) return cache.put(url, r);
            failed++;
          }).catch(function(){ failed++; });
        }).then(function(){ done++; if(done % 10 === 0 || done === total) tick(); return next(); });
      }
      tick();
      return Promise.all([next(), next(), next()]);
    }).then(function(){
      dlBusy = false;
      dlBtn.disabled = false;
      if(failed > total * 0.1){ try{ localStorage.removeItem("elv-offline"); }catch(e){} renderDl(); setDl(T[lang].dlFail); }
      else { try{ localStorage.setItem("elv-offline","1"); }catch(e){} renderDl(); }
    }).catch(function(){
      dlBusy = false; dlBtn.disabled = false; renderDl(); setDl(T[lang].dlFail);
    });
  }

  dlBtn.addEventListener("click", function(){ if(!dlBusy) download(); });

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  render();
  window.addEventListener("resize", function(){ map.invalidateSize(); });
})();
</script>
</body>
